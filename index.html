<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>単語帳</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="単語帳" />
<meta name="theme-color" content="#000000" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <button id="backBtn" class="icon-btn hidden" aria-label="戻る">←</button>
  <h1 id="topTitle">単語帳</h1>
</header>

<main id="app">

  <!-- ホーム：デッキ一覧 -->
  <section id="screen-home" class="screen">
    <div id="deckList" class="deck-list"></div>
    <button id="newDeckBtn" class="text-btn">＋ 新しいデッキ</button>
  </section>

  <!-- デッキ画面 -->
  <section id="screen-deck" class="screen">
    <h2 id="deckTitle" class="deck-heading"></h2>
    <p id="deckDue" class="deck-sub"></p>
    <div class="quiz-mode-select">
      <label>出題形式</label>
      <div class="quiz-mode-buttons">
        <button class="quiz-mode-btn active" data-mode="card">カード</button>
        <button class="quiz-mode-btn" data-mode="typing">タイピング</button>
        <button class="quiz-mode-btn" data-mode="blank">穴埋め</button>
      </div>
    </div>
    <div class="deck-actions">
      <button id="startReviewBtn" class="primary-btn">復習する</button>
      <button id="reviewAllBtn" class="secondary-btn">総復習</button>
      <button id="viewListBtn" class="secondary-btn">単語一覧</button>
      <button id="renameDeckBtn" class="text-btn">デッキ名を変更</button>
      <button id="deleteDeckBtn" class="text-btn danger">このデッキを削除</button>
    </div>
  </section>

  <!-- 復習画面 -->
  <section id="screen-review" class="screen">
    <p id="reviewProgress" class="progress"></p>
    <div id="cardStage" class="card-stage">
      <div id="reviewCard" class="card">
        <div id="cardInner" class="card-inner">
          <div class="card-face card-face-front">
            <button id="speakBtn" class="speak-btn hidden" aria-label="発音を聞く">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9.5v5h3.5l5 3.8V5.7l-5 3.8H4z" />
                <path d="M16 9a4.5 4.5 0 0 1 0 6" />
                <path d="M18.5 6.8a8 8 0 0 1 0 10.4" />
              </svg>
            </button>
            <div id="cardFront" class="card-face-text"></div>
          </div>
          <div class="card-face card-face-back">
            <button id="exampleSpeakBtn" class="speak-btn hidden" aria-label="例文の発音を聞く">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9.5v5h3.5l5 3.8V5.7l-5 3.8H4z" />
                <path d="M16 9a4.5 4.5 0 0 1 0 6" />
                <path d="M18.5 6.8a8 8 0 0 1 0 10.4" />
              </svg>
            </button>
            <div class="card-back-content">
              <div id="cardBackMeaning" class="card-face-text card-back-text"></div>
              <div id="cardBackExample" class="card-example-text hidden"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p id="reviewHint" class="hint">タップで裏返す</p>
    <div id="reviewButtons" class="review-buttons hidden">
      <button id="stillBtn" class="review-btn no">まだ</button>
      <button id="knowBtn" class="review-btn yes">覚えた</button>
    </div>

    <div id="quizStage" class="quiz-stage hidden">
      <div class="quiz-prompt-card">
        <div id="quizPrompt" class="quiz-prompt-text"></div>
      </div>
      <input id="quizInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="単語を入力" />
      <p id="quizFeedback" class="quiz-feedback hidden"></p>
      <button id="quizCheckBtn" class="primary-btn">答え合わせ</button>
      <button id="quizNextBtn" class="primary-btn hidden">次へ</button>
    </div>

    <div id="reviewDone" class="review-done hidden">
      <p id="reviewDoneText"></p>
      <button id="reviewDoneBackBtn" class="primary-btn">デッキ画面に戻る</button>
    </div>
  </section>

  <!-- 写真から追加 -->
  <section id="screen-photo" class="screen">
    <input id="photoInput" class="hidden" type="file" accept="image/*" capture="environment" />

    <div id="photoPick" class="photo-step">
      <p class="hint">単語1つが収まるように撮影してください（英語のみ対応）</p>
      <button id="photoTakeBtn" class="primary-btn">撮影する</button>
    </div>

    <div id="photoCrop" class="photo-step hidden">
      <p class="hint">単語を囲むようにドラッグして範囲を選択</p>
      <div id="photoStage" class="photo-stage">
        <img id="photoImg" alt="" />
        <div id="selectionBox" class="selection-box hidden"></div>
      </div>
      <div class="photo-actions">
        <button id="photoRetakeBtn" class="secondary-btn">撮り直す</button>
        <button id="photoRecognizeBtn" class="primary-btn">この範囲を読み取る</button>
      </div>
    </div>

    <div id="photoResult" class="photo-step hidden">
      <label>読み取り結果（編集可）</label>
      <input id="photoResultField" type="text" autocomplete="off" />
      <div class="photo-actions">
        <button id="photoReselectBtn" class="secondary-btn">範囲を選び直す</button>
        <button id="photoRetakeBtn2" class="secondary-btn">新しく撮影</button>
      </div>
      <button id="photoUseBtn" class="primary-btn">この内容を使う</button>
    </div>

    <div id="photoLoading" class="photo-step hidden">
      <p class="hint">読み取り中…</p>
    </div>
  </section>

  <!-- 単語一覧 -->
  <section id="screen-list" class="screen">
    <button id="addCardBtn" class="secondary-btn add-card-btn">＋ 単語を追加</button>
    <div class="list-controls">
      <input id="listSearch" type="text" placeholder="検索" autocomplete="off" />
      <div class="list-filter">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="unknown">まだ</button>
        <button class="filter-btn" data-filter="known">覚えた</button>
      </div>
      <div class="list-sort">
        <button class="sort-btn active" data-sort="added">追加順</button>
        <button class="sort-btn" data-sort="alpha">アルファベット順</button>
      </div>
    </div>
    <div id="cardTable" class="card-table"></div>
  </section>

  <!-- 単語追加/編集 -->
  <section id="screen-add" class="screen">
    <form id="cardForm" class="form">
      <div class="field-label-row">
        <label>表（単語）</label>
        <button type="button" id="frontCameraBtn" class="field-camera-btn">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" />
            <circle cx="12" cy="13" r="3.2" />
          </svg>
          写真から入力
        </button>
      </div>
      <input id="fieldFront" type="text" required autocomplete="off" />
      <label>裏（意味）</label>
      <input id="fieldBack" type="text" required autocomplete="off" />
      <div class="field-label-row">
        <label>例文（任意）</label>
        <button type="button" id="exampleCameraBtn" class="field-camera-btn">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" />
            <circle cx="12" cy="13" r="3.2" />
          </svg>
          写真から入力
        </button>
      </div>
      <textarea id="fieldExample" rows="3"></textarea>
      <div id="statusToggleWrap" class="status-toggle-wrap hidden">
        <label>覚えた状態</label>
        <div class="status-toggle">
          <button type="button" id="statusNotYetBtn" class="status-toggle-btn">まだ</button>
          <button type="button" id="statusKnownBtn" class="status-toggle-btn">覚えた</button>
        </div>
      </div>
      <button type="submit" class="primary-btn">保存</button>
    </form>
  </section>

  <!-- 統計 -->
  <section id="screen-stats" class="screen">
    <div class="gauge-block">
      <div class="gauge-label">
        <span>習得の進捗</span>
        <span id="gaugePercent">0%</span>
      </div>
      <div class="gauge-track"><div id="gaugeFill" class="gauge-fill"></div></div>
      <p id="gaugeSub" class="gauge-sub"></p>
    </div>
    <div id="statsBody" class="stats-body"></div>
  </section>

  <!-- 設定 -->
  <section id="screen-settings" class="screen">
    <div class="settings-block">
      <label>表示モード</label>
      <div class="theme-toggle">
        <button id="themeLightBtn" class="theme-toggle-btn" data-theme-choice="light">ライト</button>
        <button id="themeDarkBtn" class="theme-toggle-btn" data-theme-choice="dark">ダーク</button>
      </div>
    </div>

    <div class="settings-block backup-block">
      <label>バックアップ</label>
      <div class="backup-actions">
        <button id="exportBtn" class="secondary-btn">書き出す</button>
        <button id="importBtn" class="secondary-btn">読み込む</button>
      </div>
      <input id="importInput" class="hidden" type="file" accept="application/json" />
      <p class="hint">読み込みは今あるデータに追加されます（上書きはされません）</p>
    </div>
  </section>

</main>

<nav class="bottombar">
  <button class="nav-btn" data-nav="home">ホーム</button>
  <button class="nav-btn" data-nav="stats">統計</button>
  <button class="nav-btn" data-nav="settings">設定</button>
</nav>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <p id="modalMessage" class="modal-message"></p>
    <input id="modalInput" class="modal-input hidden" type="text" autocomplete="off" />
    <div class="modal-actions">
      <button id="modalCancelBtn" class="secondary-btn">キャンセル</button>
      <button id="modalOkBtn" class="primary-btn">OK</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
